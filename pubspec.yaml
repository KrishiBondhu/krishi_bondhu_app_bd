name: krishibondhu
description: A Flutter app for farmers and agricultural community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # EXISTING PACKAGES
  cupertino_icons: ^1.0.2
  email_validator: ^2.1.17
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.1.0
  flutter_tts: ^3.8.3
  speech_to_text: ^6.6.1

  # --- NEW PACKAGES ADDED FOR WEATHER MODULE ---
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  geolocator: ^10.1.0
  lottie: ^2.7.0
  # flutter_dotenv: ^5.1.0  <-- I HAVE REMOVED THIS
  # --- END OF NEW PACKAGES ---

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    # EXISTING ASSETS
    - assets/images/

    # --- NEW ASSETS ADDED FOR WEATHER MODULE ---
    # - .env  <-- I HAVE REMOVED THIS
    - assets/loading.json
    # --- END OF NEW ASSETS ---