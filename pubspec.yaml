name: krishibondhu
description: A Flutter app for farmers and agricultural community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  email_validator: ^2.1.17
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.1.0
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0
  
  # Firebase packages
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  
  # Gemini AI and related packages
  google_generative_ai: ^0.4.0
  webview_flutter: ^4.4.2
  
  # Expert Advice & Pest Control features
  image_picker: ^1.1.1
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/