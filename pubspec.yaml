name: krishi_bondhu_app_bd
description: "A digital agricultural solution app for Bangladeshi farmers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  email_validator: ^2.1.17
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  
  # Firebase packages
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  
  # Gemini AI and related packages
  google_generative_ai: ^0.4.0
  image_picker: ^1.0.4
  http: ^1.1.0
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true