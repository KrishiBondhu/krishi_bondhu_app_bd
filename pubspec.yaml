name: krishi_bondhu_app_bd
description: A Flutter app for farmers and agricultural community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  email_validator: ^2.1.17
  
  # Firebase packages
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  
  # Utility packages
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  uuid: ^4.5.2
  http: ^1.5.0
  
  # UI packages
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
